<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stable V.5 Temp</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.65);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      z-index: 10;
    }
    #hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <b>Movement Template V.5</b><br>
    WASD: Move<br>
    Shift: Sprint<br>
    Ctrl: Dash<br>
    Space: Jump / Wall Jump<br>
    V: 1st / 3rd Person
  </div>
  <div id="hint">Click to lock mouse</div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    /*
      ==========================
      FULL STABLE BUILD NOTES
      - No experimental geometries
      - No per-frame allocations
      - Dash + wall collision separated
      - Hard velocity clamps
      - Camera toggle safe
      ==========================
    */

    // ===== SCENE =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2b);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    // ===== WORLD =====
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshBasicMaterial({ color: 0x4c4c4c })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const walls = [];
    function createWall(x) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(1, 6, 80),
        new THREE.MeshBasicMaterial({ color: 0x8a8a8a })
      );
      wall.position.set(x, 3, 0);
      scene.add(wall);
      walls.push(wall);
    }
    createWall(-12);
    createWall(12);

    // ===== PLAYER =====
    const player = new THREE.Object3D();
    player.position.set(0, 0.8, 0);
    scene.add(player);

    // Safe capsule (cylinder + spheres)
    const body = new THREE.Group();
    const material = new THREE.MeshBasicMaterial({ color: 0x00ccff });

    const torso = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 1.0, 16),
      material
    );
    torso.position.y = 0.8;
    body.add(torso);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 16, 16),
      material
    );
    head.position.y = 1.3;
    body.add(head);

    const feet = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 16, 16),
      material
    );
    feet.position.y = 0.3;
    body.add(feet);

    player.add(body);

    // ===== INPUT =====
    const keys = Object.create(null);
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    document.body.addEventListener('click', () => {
      document.body.requestPointerLock();
      document.getElementById('hint').style.display = 'none';
    });

    // ===== CAMERA LOOK =====
    let yaw = 0;
    let pitch = 0;
    const mouseSensitivity = 0.002 * (1 - 0.00241);

    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement !== document.body) return;
      yaw -= e.movementX * mouseSensitivity;
      pitch -= e.movementY * mouseSensitivity;
      pitch = Math.max(-1.15, Math.min(1.15, pitch));
    });

    // ===== CAMERA MODE =====
    let firstPerson = true;
    let camToggleReady = true;

    window.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'v' && camToggleReady) {
        firstPerson = !firstPerson;
        camToggleReady = false;
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key.toLowerCase() === 'v') camToggleReady = true;
    });

    // ===== PHYSICS =====
    let vx = 0, vy = 0, vz = 0;
    const gravity = -0.03;
    const walkAccel = 0.045;
    const sprintAccel = 0.075;
    const maxSpeed = 0.55;
    const HARD_SPEED_LIMIT = 0.7;

    let grounded = true;
    let dashCooldown = 0;
    let touchingWall = false;
    let wallLockTimer = 0;

    function updateMovement() {
      player.rotation.y = yaw;

      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);

      const forwardX = -sin;
      const forwardZ = -cos;
      const rightX = cos;
      const rightZ = -sin;

      const accel = keys['shift'] ? sprintAccel : walkAccel;

      if (keys['w']) { vx += forwardX * accel; vz += forwardZ * accel; }
      if (keys['s']) { vx -= forwardX * accel; vz -= forwardZ * accel; }
      if (keys['a']) { vx -= rightX * accel; vz -= rightZ * accel; }
      if (keys['d']) { vx += rightX * accel; vz += rightZ * accel; }

      // Dash (Ctrl) – blocked briefly after wall contact
      if (keys['control'] && dashCooldown <= 0 && wallLockTimer === 0) {
        vx += forwardX * 0.6;
        vz += forwardZ * 0.6;
        dashCooldown = 35;
      }
      if (dashCooldown > 0) dashCooldown--;

      // Jump
      if (keys[' '] && grounded) {
        vy = 0.6;
        grounded = false;
      }

      vy += gravity;

      // Soft clamp
      vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));
      vz = Math.max(-maxSpeed, Math.min(maxSpeed, vz));

      vx *= grounded ? 0.82 : 0.94;
      vz *= grounded ? 0.82 : 0.94;

      player.position.x += vx;
      player.position.y += vy;
      player.position.z += vz;

      grounded = false;

      if (player.position.y <= 0.8) {
        player.position.y = 0.8;
        vy = 0;
        grounded = true;
      }

      touchingWall = false;

      walls.forEach(w => {
        const dx = player.position.x - w.position.x;
        if (Math.abs(dx) < 1) {
          touchingWall = true;
          wallLockTimer = 6;
          player.position.x = dx < 0 ? w.position.x - 1 : w.position.x + 1;
          vx = 0;
        }
      });

      // Wall run = neutral vertical movement
      if (!grounded && touchingWall && vy < 0) vy = 0;

      // Wall jump
      if (!grounded && touchingWall && keys[' ']) {
        vy = 0.55;
        vx += Math.sign(vx || 1) * 0.6;
        dashCooldown = 25;
      }

      if (wallLockTimer > 0) wallLockTimer--;

      // Absolute safety clamp
      vx = Math.max(-HARD_SPEED_LIMIT, Math.min(HARD_SPEED_LIMIT, vx));
      vz = Math.max(-HARD_SPEED_LIMIT, Math.min(HARD_SPEED_LIMIT, vz));
    }

    function updateCamera() {
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      if (firstPerson) {
        camera.position.set(player.position.x, player.position.y + 1.2, player.position.z);
        body.visible = false;
      } else {
        const dist = 5;
        camera.position.set(
          player.position.x + Math.sin(yaw) * dist,
          player.position.y + 2,
          player.position.z + Math.cos(yaw) * dist
        );
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
        body.visible = true;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updateMovement();
      updateCamera();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
